name: Sync upstream fork

on:
  schedule:
    - cron: "0 6 * * 1" # Runs every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hos1818/bandwidth-hero-vercel.git 2>/dev/null || true
          git fetch upstream
          
          # Check if upstream/main is already an ancestor of our HEAD
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "✅ Already up to date. Upstream has no new changes."
            exit 0
          fi
          
          # If upstream actually has NEW commits, create a sync branch
          SYNC_BRANCH="upstream-sync-$(date +%s)"
          git checkout -b "$SYNC_BRANCH"
          
          # 🛑 SURGICAL FIX: Stop swallowing merge conflicts. 
          if ! git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "❌ Merge conflict detected. Aborting sync to prevent silent failures."
            git merge --abort
            exit 1
          fi
          
          git push origin "$SYNC_BRANCH"
          
          # Open a PR so you can review their new code before it touches your security armor
          gh pr create \
            --title "Sync upstream changes" \
            --body "Upstream finally woke up. Review carefully for security conflicts before merging." \
            --base main \
            --head "$SYNC_BRANCH" || true
